<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Próximo Bus</title>

  <!--
    Comprobación de versión / auto-reset.
    Va lo primero en <head>, antes de cargar CSS/JS, para detectar cuanto
    antes si el servidor tiene una versión más nueva que la que vio este
    navegador la última vez. Si es así: limpia cualquier Service Worker o
    Cache Storage residual (por si quedó algo de una versión anterior) y
    fuerza una recarga completa antes de que se ejecute código viejo.
  -->
  <script>
    (function () {
      var STORAGE_KEY = "gbt:lastVersion";
      var RELOAD_FLAG = "gbt:justReloaded";

      function limpiarRastrosAntiguos() {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations()
            .then(function (regs) {
              regs.forEach(function (reg) { reg.unregister(); });
            })
            .catch(function () {});
        }
        if (window.caches && caches.keys) {
          caches.keys()
            .then(function (keys) {
              keys.forEach(function (key) { caches.delete(key); });
            })
            .catch(function () {});
        }
      }

      fetch("/api/about", { cache: "no-store" })
        .then(function (resp) { return resp.ok ? resp.json() : null; })
        .then(function (data) {
          if (!data || !data.version) return;

          var versionActual = data.version;
          var versionGuardada = localStorage.getItem(STORAGE_KEY);

          if (versionGuardada && versionGuardada !== versionActual) {
            limpiarRastrosAntiguos();
            localStorage.setItem(STORAGE_KEY, versionActual);

            // Evita bucles de recarga infinitos si algo va mal.
            if (!sessionStorage.getItem(RELOAD_FLAG)) {
              sessionStorage.setItem(RELOAD_FLAG, "1");
              location.reload();
              return;
            }
          } else {
            localStorage.setItem(STORAGE_KEY, versionActual);
          }

          sessionStorage.removeItem(RELOAD_FLAG);
        })
        .catch(function () {
          // Si falla la comprobación, no bloqueamos la carga de la app.
        });
    })();
  </script>

  <!-- CSS de Leaflet para el minimapa -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <link rel="stylesheet" href="/static/styles.css">

</head>

<body>

  <div class="container">

<header>
  <h1>🚏 Girona Bus Tracker</h1>
</header>

<!-- Minimapa con botón de recentrar -->
<div id="map-card">

  <button
    class="btn-recenter"
    onclick="recentrarUbicacion()"
    title="Recentrar en mi ubicación"
    aria-label="Recentrar en mi ubicación"
  >
    🎯
  </button>

  <button
    class="btn-config"
    onclick="abrirPanelConfig()"
    title="Configuración"
    aria-label="Configuración"
  >
    ⚙️
  </button>

</div>

<!-- Modal de configuración -->
<div id="modal-config" class="modal oculto">

  <div class="modal-contenido">

    <h2>Configuración</h2>

    <label for="input-radio">
      Radio de búsqueda (metros) [10-2000]
    </label>
    <input
      type="number"
      id="input-radio"
      min="10"
      max="2000"
      step="10"
    >

    <label for="input-max-paradas">
      Número máximo de paradas [1-20]
    </label>
    <input
      type="number"
      id="input-max-paradas"
      min="1"
      max="20"
      step="1"
    >

    <div class="modal-botones">

      <button
        class="btn-cancelar"
        onclick="cerrarPanelConfig()"
      >
        Cancelar
      </button>

      <button
        class="btn-guardar"
        onclick="guardarPanelConfig()"
      >
        Guardar
      </button>

    </div>

  </div>

</div>

<!-- Contenido con horarios de la parada -->
<div id="contenido" class="card">

  <p class="status-text">
    Obteniendo tu ubicación GPS...
  </p>

</div>

<button
  id="btn-actualizar"
  class="btn-actualizar"
  onclick="buscarAutobuses()"
>
  🔄 Actualizar Ubicación
</button>

<!-- Footer / About -->
<footer class="footer">
  <div class="container-footer">
    <span id="app-version">Versión: —</span>
    <div>
      <a class="btn-about" href="https://github.com/MiquelRoca08/Girona-Bus-Tracker" target="_blank" rel="noopener">
        <img class="icon-github" src="/static/assets/github.svg" alt="GitHub"> GitHub
      </a>
      <button class="btn-about" onclick="abrirAbout()">About</button>
    </div>
  </div>
</footer>

  </div>

  <!-- Librería JavaScript de Leaflet -->

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module" src="/static/js/main.js"></script>

  <!-- Modal About -->
  <div id="modal-about" class="modal oculto">
    <div class="modal-contenido">
      <h2>Acerca de</h2>
      <div id="about-content">
        <p>Cargando información…</p>
      </div>
      <div class="modal-botones">
        <button class="btn-guardar" onclick="cerrarAbout()">Cerrar</button>
      </div>
    </div>
  </div>

</body>
</html>
