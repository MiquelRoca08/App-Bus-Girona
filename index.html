<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">

  <title>App Bus Girona</title>
  <link rel="icon" type="image/svg+xml" href="/static/assets/favicon.svg">

  <!--
    Comprobación de versión / auto-reset.
    Va lo primero en <head>, antes de cargar CSS/JS, para detectar cuanto
    antes si el servidor tiene una versión más nueva que la que vio este
    navegador la última vez. Si es así: limpia cualquier Service Worker o
    Cache Storage residual (por si quedó algo de una versión anterior) y
    fuerza una recarga completa antes de que se ejecute código viejo.
  -->
  <script src="/static/js/version-check.js"></script>

  <!-- CSS de Leaflet para el minimapa -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="anonymous"
  />

  <link rel="stylesheet" href="/static/styles.css">

</head>

<body>

  <main class="container">

<header>
  <h1>🚏 App Bus Girona</h1>
</header>

<!-- Minimapa con botón de recentrar -->
<div id="map-card">

  <button
    class="btn-recenter"
    type="button" id="btn-recentrar"
    title="Recentrar en mi ubicación"
    aria-label="Recentrar en mi ubicación"
  >
    🎯
  </button>

  <button
    class="btn-config"
    type="button" id="btn-abrir-config"
    title="Configuración"
    aria-label="Configuración"
  >
    ⚙️
  </button>

</div>

<!-- Modal de configuración -->
<dialog id="modal-config" class="modal" closedby="any" aria-labelledby="titulo-config">

  <div class="modal-contenido">

    <h2 id="titulo-config">Configuración</h2>

    <label for="input-radio">
      Radio de búsqueda (metros) [10-2000]
    </label>
    <input
      type="number"
      id="input-radio"
      min="10"
      max="2000"
      step="10"
    >

    <label for="input-max-paradas">
      Número máximo de paradas [1-20]
    </label>
    <input
      type="number"
      id="input-max-paradas"
      min="1"
      max="20"
      step="1"
    >

    <div class="modal-botones">

      <button
        class="btn-cancelar"
        type="button" id="btn-cancelar-config"
      >
        Cancelar
      </button>

      <button
        class="btn-guardar"
        type="button" id="btn-guardar-config"
      >
        Guardar
      </button>

    </div>

  </div>

</dialog>

<!-- Modal de horarios de una parada tocada en el mapa -->
<dialog id="modal-parada-mapa" class="modal" closedby="any" aria-label="Horarios de la parada">

  <div class="modal-contenido">

    <button
      class="btn-cerrar-modal-parada"
      type="button" id="btn-cerrar-parada"
      title="Cerrar"
      aria-label="Cerrar"
    >
      ✕
    </button>

    <div id="modal-parada-mapa-contenido">
      <!-- Rellenado dinámicamente por mapa.js -->
    </div>

  </div>

</dialog>

<!-- Contenido con horarios de la parada -->
<div id="contenido" class="card">

  <p class="status-text">
    Obteniendo tu ubicación GPS...
  </p>

</div>

<button
  type="button"
  id="btn-actualizar"
  class="btn-actualizar"
>
  🔄 Actualizar Ubicación
</button>

<p id="ultima-actualizacion" class="ultima-actualizacion">
</p>

<!-- Footer / About -->
<footer class="footer">
  <div class="container-footer">
    <span id="app-version">Versión: —</span>
    <div>
      <a class="btn-about" href="https://github.com/MiquelRoca08/App-Bus-Girona" target="_blank" rel="noopener">
        <img class="icon-github" src="/static/assets/github.svg" alt="GitHub"> GitHub
      </a>
      <button class="btn-about" type="button" id="btn-abrir-about">About</button>
    </div>
  </div>
</footer>

  </main>

  <!-- Librería JavaScript de Leaflet -->

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous" defer></script>

  <script type="module" src="/static/js/main.js"></script>

  <!-- Modal About -->
  <dialog id="modal-about" class="modal" closedby="any" aria-labelledby="titulo-about">
    <div class="modal-contenido">
      <h2 id="titulo-about">Acerca de</h2>
      <div id="about-content">
        <p>Cargando información…</p>
      </div>
      <div class="modal-botones">
        <button type="button" class="btn-guardar" id="btn-cerrar-about">Cerrar</button>
      </div>
    </div>
  </dialog>

</body>
</html>
