<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Próximo Bus</title>

  <!-- CSS de Leaflet para el minimapa -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <link rel="stylesheet" href="/static/styles.css">

</head>

<body>

  <div class="container">

<header>
  <h1>🚏 Próximo Autobús</h1>
</header>

<!-- Minimapa con botón de recentrar -->
<div id="map-card">

  <button
    class="btn-recenter"
    onclick="recentrarUbicacion()"
    title="Recentrar en mi ubicación"
    aria-label="Recentrar en mi ubicación"
  >
    🎯
  </button>

</div>

<!-- Contenido con horarios de la parada -->
<div id="contenido" class="card">

  <p class="status-text">
    Obteniendo tu ubicación GPS...
  </p>

</div>

<button
  id="btn-actualizar"
  class="btn-actualizar"
  onclick="buscarAutobuses()"
>
  🔄 Actualizar Ubicación
</button>

  </div>

  <!-- Librería JavaScript de Leaflet -->

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module" src="/static/js/main.js"></script>

</body>
</html>
