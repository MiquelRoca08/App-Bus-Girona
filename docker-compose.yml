services:
  app-bus-girona:
    build: .
    image: app-bus-girona:latest
    container_name: app-bus-girona
    restart: unless-stopped
    ports:
      - "8090:8000"
    volumes:
      - ./libs:/app/libs
      - ./pdfs:/app/pdfs
    environment:
      TMG_DEBUG: "1"
      TZ: Europe/Madrid
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s 